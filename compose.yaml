services:
  nginx:
    image: nginx-sqli-analyzer:latest
    build:
      context: ./infra/
      args:
        BUILD_ARGUMENT_ENV: dev
      dockerfile: ./nginx/Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html:ro,cached
      - ./infra/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - symfony
    networks:
      - sqli_analyzer

  symfony:
    image: php-sqli-analyzer:latest
    build:
      context: ./infra/
      dockerfile: ./php/Dockerfile
    volumes:
      - .:/var/www/html:cached
      - ./infra/php/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/www.conf
      - ./infra/php/config/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - mysql
    networks:
      - sqli_analyzer
    environment:
      APP_NAME: SQLiAnalyzer
      APP_ENV: dev
      APP_SECRET: sqli-analyzer-secret-key-change-this-in-production
      DATABASE_URL: "mysql://root:secret@mysql:3306/sqli_analyzer_db"
      MAILER_DSN: smtp://mailcatcher:1025
      MESSENGER_TRANSPORT_DSN: doctrine://default
      SESSION_LIFETIME: 3600



  mysql:
    image: mysql:8.0
    platform: linux/x86_64
    command: --innodb-use-native-aio=1 --sql_mode="ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: sqli_analyzer_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql:delegated
    networks:
      - sqli_analyzer

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: secret
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - sqli_analyzer
    volumes:
      - db_admin_data:/var/www/html


volumes:
  db_admin_data:
  mysql_data:

networks:
  sqli_analyzer:
    name: sqli_analyzer
